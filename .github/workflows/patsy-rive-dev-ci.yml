name: Patsy Rive Dev CI

on:
  push:
    branches:
      - chatgpt/patsy-rive-generator-harness-2026-09-02

permissions:
  contents: write

jobs:
  tooling:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/patsy-rive-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tooling dependencies
        run: npm install
      - name: Generate Pet Rive fixture
        run: npm run generate:pet
      - name: Run tooling tests
        run: npm test
      - name: Type-check and build React harness
        run: npm run build
      - name: Verify generated Rive bytes
        run: node -e "const fs=require('fs'); const p='public/pet.riv'; const n=fs.statSync(p).size; if(n<32) process.exit(1); console.log('pet.riv bytes',n)"
      - name: Persist exported pet.riv on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/pet.riv
          if ! git diff --cached --quiet; then
            git commit -m "build: export Pet Rive fixture [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

  native-regression:
    needs: tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Build release variant
        run: ./gradlew assembleRelease --stacktrace
