name: Patsy Consolidation CI

on:
  push:
    branches:
      - codex/consolidate-final3-auth-rive-2026-08-31
      - chatgpt/thynk-music-apk-2026-08-31
  pull_request:
    branches:
      - feat/final-login-password-home-design-lock

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Apply locked THyNK integration
        run: python3 scripts/apply_thynk_music_integration.py
      - name: Persist integration on source branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/chatgpt/thynk-music-apk-2026-08-31'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/patsy/app/FinalMainActivity.kt app/src/main/java/com/patsy/app/ui/finaldesign/FinalVisualContract.kt app/src/main/java/com/patsy/app/ui/finaldesign/FinalPrimaryNavigationBar.kt app/src/main/java/com/patsy/app/ui/finaldesign/FinalHomeScreen.kt app/src/main/java/com/patsy/app/thynk/ThynkStudioScreen.kt
          if ! git diff --cached --quiet; then
            git commit -m "feat: persist locked THyNK integration"
            git push origin HEAD:chatgpt/thynk-music-apk-2026-08-31
          fi
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Build release variant
        run: ./gradlew assembleRelease --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: patsy-thynk-music-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct APK preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/chatgpt/thynk-music-apk-2026-08-31'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="thynk-music-debug-${GITHUB_SHA::7}"
          cp app/build/outputs/apk/debug/app-debug.apk PatsyApp-THyNK-Music-debug.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" PatsyApp-THyNK-Music-debug.apk --clobber
          else
            gh release create "$TAG" PatsyApp-THyNK-Music-debug.apk \
              --target "$GITHUB_SHA" \
              --title "PatsyApp THyNK Music Debug Preview" \
              --notes "Debug preview only. THyNK Studio and THyNK Music integration for device testing. Provider-backed AI/music mastering/export features remain NOT_CONFIGURED where not production-verified." \
              --prerelease
          fi
      - name: Create Android Studio project ZIP
        run: zip -rq PatsyApp-AndroidStudio-THyNK-Music.zip . -x '.git/*' '.gradle/*' 'app/build/*' 'PatsyApp-AndroidStudio-THyNK-Music.zip'
      - name: Upload Android Studio project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PatsyApp-AndroidStudio-THyNK-Music
          path: PatsyApp-AndroidStudio-THyNK-Music.zip
          compression-level: 0
