name: Patsy Consolidation CI

on:
  push:
    branches:
      - codex/consolidate-final3-auth-rive-2026-08-31
  pull_request:
    branches:
      - feat/final-login-password-home-design-lock

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Build release variant
        run: ./gradlew assembleRelease --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: patsy-consolidation-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Create Android Studio project ZIP
        run: git archive --format=zip --output=PatsyApp-AndroidStudio-current.zip HEAD
      - name: Upload Android Studio project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PatsyApp-AndroidStudio-project
          path: PatsyApp-AndroidStudio-current.zip
          compression-level: 0
