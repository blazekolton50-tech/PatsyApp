name: Apply debug preview login

on: [push]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply debug preview login'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply debug-only preview login action
        run: |
          set -euo pipefail
          python3 scripts/apply_debug_preview_login.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/patsy/app/MainActivity.kt
          git commit -m "feat: expose debug-only workspace preview button"
          git push
