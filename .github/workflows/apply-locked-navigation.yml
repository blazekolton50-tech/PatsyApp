name: Apply locked Patsy navigation

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply latest locked navigation
        run: |
          set -euo pipefail
          if [ "$(git log -1 --pretty=%s)" != "chore: run locked navigation patch" ]; then
            echo "No locked navigation patch requested."
            exit 0
          fi
          python3 scripts/apply_locked_navigation.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/patsy/app/MainActivity.kt
          git commit -m "ui: connect latest locked Patsy navigation"
          git push
