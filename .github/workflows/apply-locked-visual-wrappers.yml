name: Apply locked visual wrappers

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          set -euo pipefail
          if [ "$(git log -1 --pretty=%s)" != "chore: run locked wrapper patch" ]; then
            echo "No wrapper patch requested."
            exit 0
          fi
          python3 scripts/apply_locked_visual_wrappers.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/patsy/app/MainActivity.kt
          git commit -m "ui: use locked Patsy visual wrappers"
          git push
